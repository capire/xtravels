name: Cloud Foundry

on:
  workflow_call:
    inputs:
      environment:
        default: Staging
        type: string
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

env:
  APP_NAME: xtravels

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: cap-js/cf-setup@v2
        with:
          api: ${{ vars.CF_API }}
          org: ${{ vars.CF_ORG }}
          space: ${{ vars.CF_SPACE }}
          username: ${{ vars.CF_USERNAME }}
          password: ${{ secrets.CF_PASSWORD }}
      - run: npm set @capire:registry https://npm.pkg.github.com/
        shell: bash
      - run: npm set //npm.pkg.github.com/:_authToken=${{ secrets.CAPIRE_READ_PACKAGES }}
        shell: bash
      - run: npm i -g @sap/cds-dk @sap/appfront-cli
      - run: cds add xsuaa
      - run: npm add @cap-js/hana @sap-cloud-sdk/resilience
      - run: npm install
      - name: Write MTA extension with S/4 sandbox API key
        run: |
          cat > s4.mtaext <<EOF
          _schema-version: "3.3.0"
          ID: capire.xtravels.s4
          extends: capire.xtravels
          parameters:
            s4-api-key: "${{ secrets.S4_KEY }}"
          EOF
        shell: bash
      - run: cds up --overlay s4.mtaext

      # Deployment done, get logs and app URL
      - run: cf logs ${{ env.APP_NAME }}-srv --recent
        if: always()
      - run: cf logs ${{ env.APP_NAME }}-db-deployer --recent
        if: always()

      - name: Get App Frontend URL
        id: appfront
        env:
          AF_SERVICE_KEY: ${{ secrets.APPFRONT_SERVICE_KEY }}
        run: |
          printf '%s' "$AF_SERVICE_KEY" > "$RUNNER_TEMP/appfront-service-key.json"
          afctl login --api "https://api.eu12.dt.appfront.cloud.sap?apptid=1e9b5b6e-5203-4350-b171-6d8a150d6510" --service-key "$RUNNER_TEMP/appfront-service-key.json"
          url=$(npx afctl list sapcapiretravels --basic | awk '$1 == "URL" { print $2; exit }')
          echo "url=${url:?App Frontend URL not found}" >> "$GITHUB_OUTPUT"
    environment:
      name: ${{ inputs.environment || 'Staging' }}
      url: ${{ steps.appfront.outputs.url }}
